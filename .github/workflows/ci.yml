name: filingcabinet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install
      - uses: j178/prek-action@v3.1.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - name: Install system-level dependencies
        run: sudo apt-get update && sudo apt-get install python3-dev libmagic-dev libmagickwand-dev
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: true
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: Install dependencies
        run: uv sync --extra test --frozen
      - name: Build frontend
        run: pnpm run build
      - name: Run tests
        run: |
          coverage run --branch -m pytest -m "not slow"
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
